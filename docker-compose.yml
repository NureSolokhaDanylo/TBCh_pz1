services:
  miner-1:
    build:
      context: .
      dockerfile: Miner/Dockerfile
    container_name: miner-1
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./data/miner-1:/app/data

  miner-2:
    build:
      context: .
      dockerfile: Miner/Dockerfile
    container_name: miner-2
    ports:
      - "8082:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./data/miner-2:/app/data

  miner-3:
    build:
      context: .
      dockerfile: Miner/Dockerfile
    container_name: miner-3
    ports:
      - "8083:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./data/miner-3:/app/data
